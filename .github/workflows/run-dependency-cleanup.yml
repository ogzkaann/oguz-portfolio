name: Run Dependency Cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/run-dependency-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-cleanup-2026-08
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Upgrade to supported Maintenance LTS
        run: |
          npm install --save-exact next@15.5.24 eslint-config-next@15.5.24 react@19.2.0 react-dom@19.2.0
          npm install --save-dev eslint@^9 @types/react@^19 @types/react-dom@^19
          npm audit fix || true
      - name: Verify audit
        run: npm audit --audit-level=moderate
      - name: Verify types
        run: npm run typecheck
      - name: Verify production build
        run: npm run build
      - name: Commit validated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "fix: upgrade portfolio dependencies to supported LTS"
            git push origin HEAD:security/dependency-cleanup-2026-08
          fi
