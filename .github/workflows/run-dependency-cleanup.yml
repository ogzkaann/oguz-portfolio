name: Run Dependency Cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/run-dependency-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-cleanup-2026-08
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set supported dependency versions
        run: |
          npm pkg set 'dependencies.next=16.3.3'
          npm pkg set 'dependencies.react=19.2.0'
          npm pkg set 'dependencies.react-dom=19.2.0'
          npm pkg set 'devDependencies.eslint=^9.0.0'
          npm pkg set 'devDependencies.eslint-config-next=16.3.3'
          npm pkg set 'devDependencies.@types/react=^19.0.0'
          npm pkg set 'devDependencies.@types/react-dom=^19.0.0'
          rm -rf node_modules package-lock.json
          npm install
          npm audit fix || true
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report full dependency audit
        run: npm audit --audit-level=moderate || true
      - name: Verify types
        run: npm run typecheck
      - name: Verify production build
        run: npm run build
      - name: Commit validated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "fix: upgrade portfolio dependencies to Next.js 16 LTS"
            git push origin HEAD:security/dependency-cleanup-2026-08
          fi
