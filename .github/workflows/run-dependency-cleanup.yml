name: Run Dependency Cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/run-dependency-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-cleanup-2026-08
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize lockfile
        run: npm install
      - name: Verify all dependencies
        run: npm audit --audit-level=moderate
      - name: Verify lint
        run: npm run lint
      - name: Verify types
        run: npm run typecheck
      - name: Verify production build
        run: npm run build
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
          else
            git commit -m "chore: synchronize dependency lockfile"
            git push origin HEAD:security/dependency-cleanup-2026-08
          fi
