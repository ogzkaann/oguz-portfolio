name: Dependency Audit

on:
  push:
    branches:
      - security/dependency-cleanup-2026-08

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log('AUDIT_METADATA', JSON.stringify(audit.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
            console.log('AUDIT_ITEM', JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              via: (item.via || []).map(v => typeof v === 'string' ? v : ({name:v.name, severity:v.severity, title:v.title, range:v.range, url:v.url})),
              effects: item.effects,
              range: item.range,
              fixAvailable: item.fixAvailable
            }));
          }
          NODE
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
